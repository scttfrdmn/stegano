[package]
name = "stegano"
version = "0.7.0"
edition = "2021"
authors = ["Scott Friedman <scttfrdmn@gmail.com>"]
description = "High-performance scientific data steganography system"
license = "Apache-2.0"
repository = "https://github.com/scttfrdmn/stegano"

[lib]
name = "stegano"
crate-type = ["rlib", "cdylib"]

[dependencies]
# Core async runtime. Only the wasm32-compatible subset is enabled here;
# the multi-threaded runtime is added for native targets further below.
tokio = { version = "1.0", default-features = false, features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1.8"
blake3 = "1.5"
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Performance
rayon = "1.7"
crossbeam = "0.8"
num_cpus = "1.15"

# Math and signal processing
num-complex = "0.4"
rustfft = "6.1"

# GPU acceleration (experimental; not used by the embedding pipeline)
wgpu = { version = "22.0", optional = true, features = ["wgsl"] }
bytemuck = { version = "1.14", features = ["derive"] }
futures = "0.3"

# CUDA acceleration
cudarc = { version = "0.12", optional = true, default-features = false, features = ["driver", "nvrtc", "cuda-12000"] }

# Error correction
reed-solomon = "0.2"


# Benchmarking
criterion = { version = "0.5", optional = true }

# Logging
log = "0.4"
env_logger = "0.10"

# Utilities
hex = "0.4"

# Image codecs (imagery handler decodes pixels before embedding).
# Pure Rust; tiff built without jpeg/fax/zstd so it stays wasm32-friendly.
png = "0.18"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }

# Compression (BGZF for BAM). Default miniz_oxide backend is pure Rust and
# wasm32-safe.
flate2 = "1"

# CLI
clap = { version = "4.4", features = ["derive"] }

# FFI
libc = "0.2"

# Python bindings (optional, activated with --features python).
# abi3-py38 targets the Python stable ABI (≥3.8). pyo3 0.29 supports
# CPython up to 3.15; newer interpreters need PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1.
pyo3 = { version = "0.29", optional = true, features = ["abi3-py38"] }

# WebAssembly bindings (optional, activated with --features wasm).
# Build with: wasm-pack build --target web --no-default-features --features wasm
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# getrandom with "js" feature provides browser-native entropy for wasm32 targets.
getrandom = { version = "0.2", optional = true, features = ["js"] }

# NOTE: everything below a `[target...]` header belongs to that target only.
# Keep all cross-platform dependencies ABOVE this point.

# Native-only: multi-threaded runtime (used by #[tokio::main], the FFI and
# Python bindings) and process spawning (used by the experimental monitoring
# module). Neither compiles on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["rt-multi-thread", "process"] }
# Interactive password prompt for the CLI.
rpassword = "7"

# Metal support for macOS
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }
objc = { version = "0.2", optional = true }
core-graphics-types = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.2"
tempfile = "3.6"
hound = "3.5"  # WAV writer/reader used by signals handler tests
rand = "0.8"

# Additional testing utilities
serial_test = "3.0"  # For sequential test execution
mockall = "0.12"     # For mocking in tests

# Independent SAM/BAM/BGZF parsers used to validate SamBamHandler output
noodles-sam = "0.92"
noodles-bam = "0.97"
noodles-bgzf = "0.52"

[features]
default = []
# Unstable, unsupported modules (`gpu`, `ml`, `monitoring`). They are not used
# by the embedding pipeline and their APIs may change or be removed.
experimental = []
gpu = ["experimental", "dep:wgpu"]
metal = ["experimental", "dep:metal", "dep:objc", "dep:core-graphics-types"]
cuda = ["experimental", "dep:cudarc"]
benchmarks = ["criterion"]
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:getrandom"]

# Argon2id (payload KDF, 64 MiB / t=3) is unusably slow without optimisation;
# build it (and its BLAKE2 core) optimised even in dev/test builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
# Must unwind: the FFI wraps every export in `catch_unwind` so a panic is
# reported as `SteganoErrorCode::Panic` instead of aborting the host process.
panic = "unwind"

[profile.bench]
debug = true

[[bench]]
name = "embedding_performance"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "statistical_validation_benchmarks"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "ml_optimization_benchmarks"
harness = false
required-features = ["benchmarks", "experimental"]

[[example]]
name = "basic_demo"
path = "examples/basic_demo.rs"

[[example]]
name = "genomics_demo"
path = "examples/genomics/demo.rs"

[[example]]
name = "image_demo"
path = "examples/imagery/demo.rs"

[[example]]
name = "signal_demo"
path = "examples/signals/demo.rs"

[[example]]
name = "validation_showcase"
path = "examples/validation_showcase.rs"

[[example]]
name = "quick_validation_demo"
path = "examples/quick_validation_demo.rs"

[[bin]]
name = "stegano"
path = "src/bin/stegano.rs"
