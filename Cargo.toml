[package]
name = "stegano"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "High-performance scientific data steganography system"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/stegano-sci"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
blake3 = "1.5"
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Performance
rayon = "1.7"
crossbeam = "0.8"
num_cpus = "1.15"

# SIMD
wide = "0.7"

# Math and signal processing
num-complex = "0.4"
rustfft = "6.1"
ndarray = "0.15"

# Image processing
image = "0.24"
tiff = "0.9"

# GPU acceleration
wgpu = { version = "22.0", optional = true }
bytemuck = { version = "1.14", features = ["derive"] }

# Error correction
reed-solomon = "0.2"

# File format support
bio = "1.4"           # Bioinformatics formats
csv = "1.2"
wav = "1.0"

# Benchmarking
criterion = { version = "0.5", optional = true }

# Logging
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.2"
tempfile = "3.6"

[features]
default = ["gpu"]
gpu = ["wgpu"]
cuda = []
benchmarks = ["criterion"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true

[[bench]]
name = "embedding_performance"
harness = false
required-features = ["benchmarks"]

[[example]]
name = "basic_demo"
path = "examples/basic_demo.rs"

[[example]]
name = "genomics_demo"
path = "examples/genomics/demo.rs"

[[example]]
name = "image_demo"
path = "examples/imagery/demo.rs"

[[example]]
name = "signal_demo"
path = "examples/signals/demo.rs"
