[package]
name = "stegano"
version = "0.3.3"
edition = "2021"
authors = ["Scott Friedman <scttfrdmn@gmail.com>"]
description = "High-performance scientific data steganography system"
license = "MIT"
repository = "https://github.com/scttfrdmn/stegano"

[lib]
name = "stegano"
crate-type = ["rlib", "cdylib"]

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
blake3 = "1.5"
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Performance
rayon = "1.7"
crossbeam = "0.8"
num_cpus = "1.15"

# SIMD
wide = "0.7"

# Math and signal processing
num-complex = "0.4"
rustfft = "6.1"
ndarray = "0.15"

# Image processing
image = "0.24"
tiff = "0.9"

# GPU acceleration
wgpu = { version = "22.0", optional = true, features = ["wgsl"] }
bytemuck = { version = "1.14", features = ["derive"] }
futures = "0.3"

# CUDA acceleration
cudarc = { version = "0.12", optional = true, default-features = false, features = ["driver", "nvrtc", "cuda-12000"] }

# Error correction
reed-solomon = "0.2"

# File format support
bio = "1.4"           # Bioinformatics formats
csv = "1.2"
wav = "1.0"

# Benchmarking
criterion = { version = "0.5", optional = true }

# Logging
log = "0.4"
env_logger = "0.10"

# Utilities
hex = "0.4"

# CLI
clap = { version = "4.4", features = ["derive"] }

# FFI
libc = "0.2"

# Metal support for macOS
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }
objc = { version = "0.2", optional = true }
core-graphics-types = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.2"
tempfile = "3.6"
rand = "0.8"

# Code coverage tools
cargo-tarpaulin = "0.27"
coverage-helper = "0.2"

# Additional testing utilities
serial_test = "3.0"  # For sequential test execution
mockall = "0.12"     # For mocking in tests

[features]
default = ["gpu"]
gpu = ["wgpu"]
metal = ["dep:metal", "dep:objc", "dep:core-graphics-types"]
cuda = ["dep:cudarc"]
benchmarks = ["criterion"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true

# [[bench]]
# name = "embedding_performance"
# harness = false
# required-features = ["benchmarks"]

[[example]]
name = "basic_demo"
path = "examples/basic_demo.rs"

[[example]]
name = "genomics_demo"
path = "examples/genomics/demo.rs"

[[example]]
name = "image_demo"
path = "examples/imagery/demo.rs"

[[example]]
name = "signal_demo"
path = "examples/signals/demo.rs"

[[example]]
name = "gpu_acceleration_demo"
path = "examples/gpu_acceleration_demo.rs"
required-features = ["gpu"]

# Phantom-science integration examples
[[example]]
name = "basic_integration"
path = "examples/phantom_science/basic_integration.rs"

[[example]]
name = "fasta_embedding"
path = "examples/phantom_science/fasta_embedding.rs"

[[example]]
name = "fastq_quality_scores"
path = "examples/phantom_science/fastq_quality_scores.rs"

[[example]]
name = "validation_showcase"
path = "examples/validation_showcase.rs"

[[example]]
name = "quick_validation_demo"
path = "examples/quick_validation_demo.rs"

[[bin]]
name = "stegano"
path = "src/bin/stegano.rs"
