# Cargo-deny configuration for Stegano project
# Enforces security and licensing policies

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[output]
feature-depth = 1

[advisories]
# Security vulnerability database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
    # Ignore specific advisories here if needed
    # Example: "RUSTSEC-2020-0001",
]

[licenses]
# License allowlist for DEPENDENCIES ONLY
# Note: This project itself is licensed under Apache-2.0
# These licenses are allowed for external dependencies we use
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-1.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
]
copyleft = "warn"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["Unicode-DFS-2016"]
name = "unicode-ident"

[bans]
# Dependency restrictions
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true

# Deny specific crates
deny = [
    # Vulnerable or problematic crates
    { name = "openssl", version = "*" },  # Prefer rustls
    { name = "native-tls", version = "*" },  # Prefer rustls
]

# Skip certain crates for multiple version checks
skip = [
    { name = "windows-sys", version = "*" },
    { name = "windows_x86_64_msvc", version = "*" },
]

# Skip trees with these crates as root
skip-tree = [
    { name = "criterion", version = "*" },  # Dev dependency
]

[sources]
# Source code restrictions
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []