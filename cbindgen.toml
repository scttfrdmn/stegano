# cbindgen configuration for the stegano C ABI (src/ffi.rs).
#
# Regenerate both checked-in copies of the header after changing any FFI
# signature:
#
#   cbindgen --config cbindgen.toml --output include/stegano.h src/ffi.rs
#   cbindgen --config cbindgen.toml --output go/stegano.h src/ffi.rs
#
# go/stegano.h lives inside the Go module (go/) so that
# `go get github.com/scttfrdmn/stegano/go` builds without a repo checkout.
# CI fails if either file differs from the regenerated output.

language = "C"
header = "/* SPDX-License-Identifier: Apache-2.0 */"
autogen_warning = "/* Generated by cbindgen from src/ffi.rs -- do not edit by hand. */"
include_guard = "STEGANO_H"
include_version = false
cpp_compat = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
style = "both"
usize_is_size_t = true
documentation = true
documentation_style = "c"

[export]
# Only the C ABI: skip Rust `pub const`s from other modules.
item_types = ["functions", "enums", "structs"]
# Exported for C callers even though functions take the format as uint32_t.
include = ["CDataFormat"]

[enum]
# C enumerators share one namespace: emit SteganoErrorCode_Success,
# CDataFormat_Sam, ... instead of bare Success / Sam.
prefix_with_name = true

[parse]
parse_deps = false
