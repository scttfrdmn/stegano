# cargo-deny configuration file for supply chain security
# https://github.com/EmbarkStudios/cargo-deny

[advisories]
ignore = [
    # paste is unmaintained but not a security risk
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
    "LGPL-3.0",
]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]