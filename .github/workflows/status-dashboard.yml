name: Status Dashboard Update

on:
  # Update dashboard every hour during work hours
  schedule:
    - cron: '0 9,18 * * 1-5'  # Twice daily (9 AM, 6 PM) Mon-Fri only
  
  # Update on significant events
  workflow_run:
    workflows: ["Feature Branch CI", "Develop Integration Pipeline"]
    types: [completed]
  
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-dashboard:
    name: Update Status Dashboard
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests jinja2 plotly pandas
          
      - name: Generate comprehensive dashboard
        run: |
          python3 scripts/generate-dashboard.py \
            --output-dir dashboard \
            --include-metrics \
            --include-trends \
            --include-predictions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create status badges
        run: |
          python3 scripts/create-status-badges.py \
            --status-dir dashboard \
            --badge-dir .github/badges
            
      - name: Update README badges
        run: |
          python3 scripts/update-readme-badges.py \
            --readme README.md \
            --badge-dir .github/badges
            
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          
      - name: Commit badge updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Only commit if there are significant changes (not just timestamp updates)
          if git diff --quiet .github/badges/ README.md; then
            echo "No badge changes detected - skipping commit"
          else
            # Check if changes are substantial (not just minor updates)
            BADGE_CHANGES=$(git diff --name-only .github/badges/ README.md | wc -l)
            if [ "$BADGE_CHANGES" -gt 0 ]; then
              git add .github/badges/ README.md
              git commit -m "chore: update CI/CD status badges [skip ci]

              - Updated build status badges
              - Updated test coverage badges  
              - Updated security badges
              - Generated by automated dashboard workflow"
              git push
            fi
          fi

  performance-analysis:
    name: Performance Trend Analysis
    runs-on: ubuntu-latest
    needs: update-dashboard
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install analysis tools
        run: |
          pip install pandas numpy matplotlib seaborn plotly
          
      - name: Analyze performance trends
        run: |
          python3 scripts/analyze-performance-trends.py \
            --period "30 days" \
            --output performance-analysis.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate performance report
        run: |
          python3 scripts/generate-performance-report.py \
            --analysis-file performance-analysis.json \
            --output performance-report.html
            
      - name: Check for performance regressions
        id: perf-check
        run: |
          python3 scripts/check-performance-regression.py \
            --analysis-file performance-analysis.json \
            --threshold 20  # 20% regression threshold
            
      - name: Upload performance artifacts
        uses: actions/upload-artifact@v3
        with:
          name: performance-analysis-${{ github.run_number }}
          path: |
            performance-analysis.json
            performance-report.html
          retention-days: 90
          
      - name: Alert on performance regression
        if: steps.perf-check.outputs.regression_detected == 'true'
        run: |
          echo "🚨 Performance regression detected!"
          echo "Regression: ${{ steps.perf-check.outputs.regression_percentage }}%"
          echo "Affected workflows: ${{ steps.perf-check.outputs.affected_workflows }}"
          
          # Send alert notification
          python3 scripts/send-performance-alert.py \
            --regression-data performance-analysis.json \
            --threshold-exceeded ${{ steps.perf-check.outputs.regression_percentage }}

  health-metrics:
    name: CI/CD Health Metrics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Collect health metrics
        run: |
          python3 scripts/collect-health-metrics.py \
            --period "7 days" \
            --output health-metrics.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Calculate health score
        id: health-score
        run: |
          python3 scripts/calculate-health-score.py \
            --metrics-file health-metrics.json \
            --output health-score.json
            
      - name: Generate health trends
        run: |
          python3 scripts/generate-health-trends.py \
            --metrics-file health-metrics.json \
            --score-file health-score.json \
            --output health-trends.html
            
      - name: Update health status
        run: |
          echo "## 📊 CI/CD Health Score: ${{ steps.health-score.outputs.current_score }}/100" > health-status.md
          echo "" >> health-status.md
          echo "**Trend**: ${{ steps.health-score.outputs.trend_direction }} (${{ steps.health-score.outputs.trend_change }})" >> health-status.md
          echo "**Last Updated**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> health-status.md
          
      - name: Upload health metrics
        uses: actions/upload-artifact@v3
        with:
          name: health-metrics-${{ github.run_number }}
          path: |
            health-metrics.json
            health-score.json
            health-trends.html
            health-status.md
          retention-days: 90

  automated-reports:
    name: Generate Automated Reports
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Generate weekly report
        if: github.event.schedule == '0 18 * * 5'  # Friday 6 PM
        run: |
          python3 scripts/generate-weekly-report.py \
            --output weekly-report-$(date +%Y%m%d).md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate monthly report
        if: github.event.schedule == '0 18 1 * *'  # 1st of month, 6 PM
        run: |
          python3 scripts/generate-monthly-report.py \
            --output monthly-report-$(date +%Y%m).md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Send report notifications
        run: |
          # Send weekly/monthly reports to stakeholders
          python3 scripts/send-report-notifications.py \
            --report-type "$(echo '${{ github.event.schedule }}' | grep -q '0 18 1' && echo 'monthly' || echo 'weekly')" \
            --report-file "$(ls *-report-*.md | head -1)"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          
      - name: Archive reports
        uses: actions/upload-artifact@v3
        with:
          name: automated-reports-${{ github.run_number }}
          path: "*-report-*.md"
          retention-days: 365  # Keep reports for a year

  status-aggregation:
    name: Aggregate Status Information
    runs-on: ubuntu-latest
    needs: [update-dashboard, performance-analysis, health-metrics]
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        
      - name: Aggregate status data
        run: |
          python3 scripts/aggregate-status-data.py \
            --input-dir . \
            --output aggregated-status.json
            
      - name: Create unified status page
        run: |
          python3 scripts/create-unified-status.py \
            --status-file aggregated-status.json \
            --output unified-status.html
            
      - name: Deploy unified status
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: status
          
      - name: Update status API endpoint
        run: |
          # Create a simple JSON API endpoint for external monitoring
          python3 scripts/create-status-api.py \
            --status-file aggregated-status.json \
            --output api/status.json
            
      - name: Notify monitoring systems
        run: |
          # Ping external monitoring systems with updated status
          python3 scripts/notify-external-monitors.py \
            --status-file aggregated-status.json \
            --endpoints "${{ secrets.EXTERNAL_MONITOR_ENDPOINTS }}"