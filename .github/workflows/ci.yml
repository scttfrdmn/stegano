name: Security & Dependencies Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Daily security check at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Security and dependency audit only
  security-audit:
    name: Security & Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Install cargo-audit
        run: cargo install --force cargo-audit
        
      - name: Install cargo-deny
        run: cargo install --force cargo-deny
        
      - name: Run security audit
        run: cargo audit
        
      - name: Check licenses
        run: cargo deny check licenses
        
      - name: Check security advisories
        run: cargo deny check advisories
        
      - name: Check for duplicate dependencies
        run: cargo deny check bans
        continue-on-error: true  # Allow warnings for duplicate dependencies
        
      - name: Verify project compiles
        run: cargo check --workspace