name: Feature Branch CI

on:
  push:
    branches: [ 'feature/**' ]
  pull_request:
    branches: [ develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Basic validation for all feature branches
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Check formatting
        run: cargo fmt -- --check
        
      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
        
      - name: Check documentation
        run: cargo doc --all-features --no-deps

  # Cross-platform testing matrix
  test:
    name: Test Suite
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        features: [default, all-features]
        include:
          # Test specific feature combinations
          - os: ubuntu-latest
            rust: stable
            features: gpu
          - os: macos-latest
            rust: stable
            features: metal
          - os: ubuntu-latest
            rust: stable
            features: enterprise
            
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@${{ matrix.rust }}
          
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl
          
      - name: Run tests
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo test --verbose
          elif [ "${{ matrix.features }}" = "all-features" ]; then
            cargo test --all-features --verbose
          else
            cargo test --features ${{ matrix.features }} --verbose
          fi
        shell: bash
        
      - name: Run doctests
        run: |
          if [ "${{ matrix.features }}" = "all-features" ]; then
            cargo test --doc --all-features
          fi
        shell: bash

  # Security and dependency auditing
  security:
    name: Security Audit
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Run security audit
        run: cargo audit
        
      - name: Check for unsafe code
        run: |
          echo "Checking for unsafe blocks..."
          if grep -r "unsafe" src/ --include="*.rs" | grep -v "//.*unsafe" | grep -v "test"; then
            echo "⚠️ Found unsafe code blocks - please review:"
            grep -r "unsafe" src/ --include="*.rs" | grep -v "//.*unsafe" | grep -v "test"
            echo "Note: Unsafe code requires additional review and justification"
          else
            echo "✅ No unsafe code blocks found"
          fi

  # Performance regression testing
  performance:
    name: Performance Tests
    needs: validate
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[bench]') || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
          
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run benchmarks
        run: cargo bench --all-features
        
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 30

  # GPU-specific testing (if applicable)
  gpu-tests:
    name: GPU Tests
    needs: validate
    runs-on: ubuntu-latest
    if: contains(github.head_ref, 'gpu') || contains(github.head_ref, 'metal')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          
      - name: Test GPU detection
        run: |
          vulkaninfo || echo "No Vulkan support available"
          
      - name: Run GPU tests
        run: cargo test --features gpu --verbose
        env:
          # Use software rendering for CI
          WGPU_BACKEND: vulkan

  # Documentation building and validation
  docs:
    name: Documentation
    needs: validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
          
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Build documentation
        run: |
          cargo doc --all-features --no-deps --verbose
          
      - name: Check for documentation warnings
        run: |
          cargo doc --all-features --no-deps 2>&1 | tee doc_output.txt
          if grep -i "warning" doc_output.txt; then
            echo "⚠️ Documentation warnings found - please fix"
            exit 1
          fi
          
      - name: Validate links in documentation
        run: |
          # Check for broken internal links in generated docs
          find target/doc -name "*.html" -exec grep -l "href.*\.html" {} \; | head -10 | while read file; do
            echo "Checking links in $file"
          done

  # Integration tests with existing features
  integration:
    name: Integration Tests
    needs: [test, security]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
          
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-integration-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run integration tests
        run: |
          cargo test --test '*' --all-features --verbose
          
      - name: Test examples compilation
        run: |
          for example in examples/**/*.rs; do
            if [ -f "$example" ]; then
              echo "Testing compilation of $example"
              cargo check --example $(basename "$example" .rs) --all-features
            fi
          done
          
      - name: Test FFI interface (if available)
        run: |
          if [ -f "tests/ffi_tests.c" ]; then
            echo "Testing FFI interface"
            gcc -shared -fPIC -o libtestffi.so tests/ffi_tests.c
          fi

  # Memory leak detection
  memory-tests:
    name: Memory Tests
    needs: validate
    runs-on: ubuntu-latest
    if: contains(github.head_ref, 'memory') || contains(github.event.head_commit.message, '[memory]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install valgrind
        run: sudo apt-get install -y valgrind
        
      - name: Run memory tests
        run: |
          cargo build --release --all-features
          valgrind --leak-check=full --error-exitcode=1 ./target/release/examples/basic_demo || true

  # Feature-specific validation
  feature-validation:
    name: Feature Validation
    needs: validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
          
      - name: Validate feature flags
        run: |
          echo "Testing individual feature combinations..."
          
          # Test each feature individually
          for feature in gpu metal enterprise python wasm; do
            echo "Testing feature: $feature"
            if cargo check --features $feature --quiet 2>/dev/null; then
              echo "✅ Feature $feature compiles successfully"
            else
              echo "❌ Feature $feature failed to compile"
            fi
          done
          
      - name: Test minimal build
        run: |
          echo "Testing minimal build (no default features)..."
          cargo check --no-default-features
          
      - name: Test maximal build
        run: |
          echo "Testing maximal build (all features)..."
          cargo check --all-features

  # Branch-specific quality gates
  quality-gates:
    name: Quality Gates
    needs: [test, security, docs, integration]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install coverage tools
        run: |
          cargo install cargo-tarpaulin
          
      - name: Generate coverage report
        run: |
          cargo tarpaulin --all-features --out xml --verbose
          
      - name: Check coverage threshold
        run: |
          coverage=$(grep 'line-rate=' cobertura.xml | head -1 | grep -o 'line-rate="[^"]*"' | grep -o '[0-9.]*')
          echo "Coverage: ${coverage}%"
          
          # Require 95% coverage for feature branches
          threshold=0.95
          if (( $(echo "$coverage >= $threshold" | bc -l) )); then
            echo "✅ Coverage check passed: ${coverage}% >= ${threshold}%"
          else
            echo "❌ Coverage check failed: ${coverage}% < ${threshold}%"
            exit 1
          fi
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./cobertura.xml
          flags: feature-branch
          name: feature-branch-coverage
          
  # Notify on completion
  status-check:
    name: Status Check
    needs: [quality-gates, feature-validation]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check overall status
        run: |
          if [ "${{ needs.quality-gates.result }}" = "success" ] && [ "${{ needs.feature-validation.result }}" = "success" ]; then
            echo "✅ All checks passed! Ready for review."
          else
            echo "❌ Some checks failed. Please review and fix issues."
            exit 1
          fi
          
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const success = '${{ needs.quality-gates.result }}' === 'success' && '${{ needs.feature-validation.result }}' === 'success';
            
            const body = success 
              ? '✅ **All CI checks passed!** This PR is ready for review.\n\n- Code quality validated\n- Tests passing on all platforms\n- Security audit clean\n- Documentation up to date'
              : '❌ **Some CI checks failed.** Please review the failed checks and fix any issues.\n\nClick on the failed check details above for more information.';
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body
            });