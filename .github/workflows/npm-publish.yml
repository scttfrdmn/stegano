name: npm publish

# Publishes the `stegano-wasm` npm package (WebAssembly bindings) when a
# `v*` tag is pushed. Authenticates with npm trusted publishing (OIDC): no
# stored token is needed once the package's Trusted Publisher is configured on
# npmjs.com (user scttfrdmn, repo stegano, workflow npm-publish.yml). An
# NPM_TOKEN secret is used only as a fallback, e.g. to bootstrap the first
# publish. See CONTRIBUTING.md, "Publishing to npm".

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and run `npm publish --dry-run` only
        type: boolean
        default: true
      tag:
        description: >-
          Existing release tag to build and publish (e.g. v0.7.0) using this
          workflow version; empty = the ref the workflow runs on
        type: string
        default: ''

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); provenance when the repo is public

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PACKAGE: stegano-wasm

jobs:
  publish:
    name: publish stegano-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14).
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Build and assemble pkg/
        run: ./scripts/build-wasm.sh

      - name: Pack
        id: pack
        run: |
          mkdir -p dist
          tarball="./dist/$(npm pack ./pkg --pack-destination dist --json | jq -r '.[0].filename')"
          version="$(jq -r .version pkg/package.json)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball ($version)"

      - name: Smoke tests (the exact tarball that will be published)
        run: node npm/test/run.mjs --tarball "${{ steps.pack.outputs.tarball }}"

      - name: Check tag matches package version
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            REF_TYPE=tag REF_NAME="$INPUT_TAG"
          else
            REF_TYPE="$GITHUB_REF_TYPE" REF_NAME="$GITHUB_REF_NAME"
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "${REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::Tag $REF_NAME does not match package version $VERSION (from Cargo.toml)"
              exit 1
            fi
          elif [ "$DRY_RUN" != "true" ]; then
            echo "::error::Real publishes must run on a v* tag or set the tag input (got $REF_TYPE $REF_NAME); use dry_run on branches"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: exists
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          published="$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            echo "::notice::$PACKAGE@$VERSION is already published on npm; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (dry run)
        if: steps.exists.outputs.skip != 'true' && inputs.dry_run
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --dry-run

      - name: Publish
        if: steps.exists.outputs.skip != 'true' && !inputs.dry_run
        env:
          # Optional fallback; trusted publishing (OIDC) is tried first and
          # needs no token. Provenance is generated automatically for public
          # repositories and skipped for private ones.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret; publishing via npm trusted publishing (OIDC)"
          fi
          npm publish "${{ steps.pack.outputs.tarball }}" --access public
